# Render Blueprint — UniHive API (monorepo-safe)
services:
  - type: web
    name: unihive-api
    runtime: python
    plan: free
    branch: main
    # Root Directory must stay empty (repo root). Dashboard Start Command is often
    # `uvicorn app.main:app` which would miss backend/app without PYTHONPATH + the
    # root `app/` shim. Prefer start.sh; PYTHONPATH keeps the default uvicorn working.
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
